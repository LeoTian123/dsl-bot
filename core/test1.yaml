NPC_name: 旅游行程规划机器人

start_state: welcome
end_state:
  - default_end
  - hotel_book
  - flight_confirm
  - attraction_ticket
  - restaurant_reserve
  - budget_summary
  - itinerary_complete

states:
  welcome:
    output: "欢迎来到旅游规划机器人！您是想规划国内旅行还是国际旅行？"
    options:
      国内旅行: domestic
      国际旅行: international
      退出: default_end

  domestic:
    output: "请选择国内目的地城市？"
    options:
      北京: beijing
      上海: shanghai
      广州: guangzhou
      返回: welcome

  international:
    output: "请选择国际目的地国家？"
    options:
      日本: japan
      美国: usa
      法国: france
      返回: welcome

  beijing:
    output: "北京行程规划：您想先安排交通、住宿还是景点？（已记录目的地：北京）"
    options:
      交通: transport_beijing
      住宿: hotel_beijing
      景点: attraction_beijing
      返回: domestic

  shanghai:
    output: "上海行程规划：您想先安排交通、住宿还是景点？（已记录目的地：上海）"
    options:
      交通: transport_shanghai
      住宿: hotel_shanghai
      景点: attraction_shanghai
      返回: domestic

  guangzhou:
    output: "广州行程规划：您想先安排交通、住宿还是景点？（已记录目的地：广州）"
    options:
      交通: transport_guangzhou
      住宿: hotel_guangzhou
      景点: attraction_guangzhou
      返回: domestic

  japan:
    output: "日本行程规划：您想先安排交通、住宿还是景点？（已记录目的地：日本）"
    options:
      交通: transport_japan
      住宿: hotel_japan
      景点: attraction_japan
      返回: international

  usa:
    output: "美国行程规划：您想先安排交通、住宿还是景点？（已记录目的地：美国）"
    options:
      交通: transport_usa
      住宿: hotel_usa
      景点: attraction_usa
      返回: international

  france:
    output: "法国行程规划：您想先安排交通、住宿还是景点？（已记录目的地：法国）"
    options:
      交通: transport_france
      住宿: hotel_france
      景点: attraction_france
      返回: international

  transport_beijing:
    output: "北京交通：推荐高铁或飞机。您确认航班预订吗？（目的地：北京）"
    options:
      是: flight_confirm
      否: beijing
      切换安排: beijing

  transport_shanghai:
    output: "上海交通：推荐高铁或飞机。您确认航班预订吗？（目的地：上海）"
